[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "football-data"
version = "0.1.0"
description = "Auditable source-specific data marts for Fantasy Premier League modelling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "lxml>=5.2",
  "pandas>=2.2",
  "numpy>=2.0",
  "pyarrow>=16",
  "pydantic>=2.7",
  "ortools>=9.10",
  "PyYAML>=6.0",
  "scipy>=1.14",
  "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "hypothesis>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "duckdb>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/football_data", "src/fpl"]

[tool.ruff]
target-version = "py312"
exclude = [".venv_validation", ".test-tmp", ".validation-test-tmp-2"]

[tool.ruff.lint]
ignore = ["BLE001", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["pandas", "scipy.*", "ortools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: tests that access live providers"]
addopts = "-m 'not integration'"
